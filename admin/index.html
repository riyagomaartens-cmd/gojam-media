<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio OS | Go Jam Media</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>

  <!-- LOGIN -->
  <div class="login-wrap" id="login">
    <form class="login-card" id="login-form">
      <img src="/images/logo.png" alt="Go Jam Media" />
      <h1>Studio OS</h1>
      <p>Sign in to manage clients and deliveries.</p>
      <input type="email" id="login-email" placeholder="Email" autocomplete="username" required />
      <input type="password" id="login-pass" placeholder="Password" autocomplete="current-password" required />
      <div class="login-err" id="login-err"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="login-btn">Sign in</button>
    </form>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <header class="topbar">
      <a class="brand" href="#/clients"><img src="/images/logo.png" alt="Go Jam Media" /></a>
      <nav id="nav">
        <a href="#/clients" data-nav="clients">Clients</a>
        <a href="#/projects" data-nav="projects">Projects</a>
        <a href="#/deliveries" data-nav="deliveries">Deliveries</a>
      </nav>
      <div class="spacer"></div>
      <span class="who" id="who"></span>
      <button class="btn btn-ghost btn-sm" id="signout">Sign out</button>
    </header>
    <main class="wrap" id="view"><!-- views render here --></main>
  </div>

  <div id="modal-root"></div>
  <div class="toast" id="toast"></div>

  <script type="module" src="/admin/app.js"></script>
</body>
</html>
